name: Nightly Models (MC + ML)

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

jobs:
  run-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node deps
        run: npm ci

      - name: Run Monte Carlo + EV pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPORT_KEYS: "basketball_nba,basketball_ncaab"
          MC_SIMS: "10000"
        run: npx tsx scripts/run_monte_carlo.ts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements-ml.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-ml.txt

      - name: Train ML adjustments + write to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPORT_KEYS: "basketball_nba,basketball_ncaab"
          MODEL_VERSION: "gbm_v1"
        run: python scripts/train_ml_adjustments.py

