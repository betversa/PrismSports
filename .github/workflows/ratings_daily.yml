name: Daily Ratings Build

on:
  schedule:
    # 6:10 AM America/Chicago (12:10 UTC) — adjust if you want a different time
    - cron: "10 12 * * *"
  workflow_dispatch: {}

concurrency:
  group: ratings-daily
  cancel-in-progress: true

jobs:
  build_ratings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build Ratings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ratings:build
