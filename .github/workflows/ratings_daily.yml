name: Daily Ratings Build

on:
  schedule:
    - cron: "10 12 * * *" # 6:10 AM America/Chicago (12:10 UTC)
  workflow_dispatch: {}

concurrency:
  group: ratings-daily
  cancel-in-progress: true

jobs:
  build_ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build NCAAB Ratings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPORT_KEY: basketball_ncaab
        run: npm run ratings:build:ncaab

      - name: Build NBA Ratings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPORT_KEY: basketball_nba
          NBA_BR_LEAGUE_YEAR: "2025"
          SEASON: "2024-25"
        run: npm run ratings:build:nba

