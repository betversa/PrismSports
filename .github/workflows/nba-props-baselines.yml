# .github/workflows/nba-props-baselines.yml
name: NBA Props Baselines

on:
  workflow_dispatch:
  schedule:
    # America/Chicago is UTC-6 in winter (current), UTC-5 in summer.
    # These are UTC times that roughly map to:
    # - 07:10 CT -> 13:10 UTC (winter) / 12:10 UTC (summer)
    # - 13:10 CT -> 19:10 UTC (winter) / 18:10 UTC (summer)
    #
    # If you want these to stay perfectly aligned to CT through DST,
    # switch to running hourly and gate inside the script, or accept the 1-hour DST drift.
    - cron: "10 13 * * *"
    - cron: "10 19 * * *"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Load NBA prop baselines (FantasyPros -> Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_ENV: production
        run: npm run nba:props:baselines:load
