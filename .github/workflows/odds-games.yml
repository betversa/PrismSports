name: Odds Loader (Games)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run games odds loader
        run: npm run odds:load
        env:
          # Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

          # Mode
          LOADER_MODE: games

          # Vars
          SPORT_KEYS: ${{ vars.SPORT_KEYS }}        # basketball_ncaab,basketball_nba
          GAME_MARKETS: ${{ vars.GAME_MARKETS }}    # h2h,spreads,totals
          BOOKMAKERS: ${{ vars.BOOKMAKERS }}
