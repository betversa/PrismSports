name: Load NCAAB Stats (TeamRankings → Supabase)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"

concurrency:
  group: load-ncaab-stats
  cancel-in-progress: true

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run loader
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: "2025-26"
        run: |
          node --version
          node --loader ts-node/esm ./scripts/teamRankingsStatsLoader.ts
